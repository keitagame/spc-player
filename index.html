<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>SPC Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

<!-- MP3エンコード用ライブラリ -->
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>

<style>
*{
  color-scheme: dark;
  box-sizing: border-box;
}
body{
  font-family: "DotGothic16", sans-serif;
  font-weight: 400;
  font-style: normal;
  background:black;
  color: white;
  margin: 16px;
}
.hidden-input {
  display: none;
}

/* ラベルをボタンとして装飾する */
.upload-label {
  display: inline-block;
  border:1px solid white;
  color: white;
  padding: 10px 20px;
  border-radius: 0px;
  cursor: pointer;
}

/* リスト全体の「・」を消して、横並び（Flexbox）にする */
.nav-list {
  list-style: none;
  padding: 0;
  margin: 0;
  font-size:13px;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: center;
}

.button, .select-box, .number-input {
  font-family: "DotGothic16", sans-serif;
  font-weight: 400;
  background:black;
  font-size:13px;
  display: inline-block;
  border:1px solid white;
  color: white;
  padding: 10px 15px;
  border-radius: 0px;
  outline: none;
}

.button {
  cursor: pointer;
}

.number-input {
  width: 60px;
  text-align: center;
}

.button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* エクスポート関連スタイル */
.btn-export {
  border-color: #00ffcc;
  color: #00ffcc;
}

.btn-export.is-exporting {
  background: #00ffcc;
  color: black;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.4; }
  100% { opacity: 1; }
}

.export-status {
  color: #00ffcc;
  font-size: 13px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.rec-dot {
  width: 10px;
  height: 10px;
  background-color: #00ffcc;
  border-radius: 50%;
  display: inline-block;
}

#spcCanvas {
  width: 1340px;
  max-width: 100%;
  height: auto;
  aspect-ratio: 2 / 1;
  border: 1px solid #333;
  margin-top: 10px;
  image-rendering: pixelated;
}

.o {
  font-size:20px;
  margin: 10px 0 5px 0;
}
</style>
</head>
<body>
<header>
  <nav>
    <ul class="nav-list">
      <li><label class="upload-label">SPCを選択<input type="file" id="fileinput" accept=".spc" class="hidden-input"></label></li>
      <!-- 画像アップロード用の追加項目 -->
      <li><label class="upload-label">背景画像を選択<input type="file" id="bgInput" class="hidden-input" accept="image/*"></label></li>
      <li><label class="upload-label">パーツ画像を選択<input type="file" id="partsInput" class="hidden-input" accept="image/*"></label></li>
      
      <li><button class="button" id="play" type="button">再生</button></li>

      <li><span id="exportStatus" class="export-status" style="display: none;"><span class="rec-dot"></span><span id="exportProgress">0 / 60s (0%)</span></span></li>
    </ul>

</header>

<script src="libspc.js"></script>
<!-- 内部解像度を 1024x1024 に拡大 -->
<canvas id="spcCanvas" width="1340" height="670"></canvas>
<br>
<div class="o">spc player online</div>
このサイトはweb上で.spcを再生できるspcプレイヤーです。<br>
正しく再生されなかったりする場合があります。<br>
down.spcは私がテスト用に作ったファイルです。

<script>
function pitchToNote(pitch) {
  if (!pitch) return "-";
  const freq = 32000 * pitch / 4096;
  if (!isFinite(freq) || freq <= 0) return "-";
  const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
  const midi = Math.round(69 + 12 * Math.log2(freq / 440));
  const octave = Math.floor(midi / 12) - 1;
  const name = noteNames[((midi % 12) + 12) % 12];
  return `${name}${octave}`;
}

    // Global Application State
    let player = null;
    let audioCtx = null;
    let animationFrameId = null;

    // DOM Elements
    const canvas = document.getElementById('spcCanvas');
    const ctx = canvas.getContext('2d');
    
    const fileInput = document.getElementById('fileinput');
    const bgInput = document.getElementById('bgInput');
    const partsInput = document.getElementById('partsInput');
    const testPlay = document.getElementById('test');
    const btnPlay = document.getElementById('play');
    const btnStop = document.getElementById('stop');

    // Export DOM Elements
    const exportDurationInput = document.getElementById('exportDuration');
    const exportFormatSelect = document.getElementById('exportFormat');
    const btnExport = document.getElementById('btnExport');
    const exportStatus = document.getElementById('exportStatus');
    const exportProgress = document.getElementById('exportProgress');

    // Export State
    let isExporting = false;
    let exportMode = 'wav';
    let exportTargetDuration = 60;
    let exportStartTime = 0;
    let exportInterval = null;

    // Audio Capture Nodes & Buffers
    let mediaStreamDest = null;
    let scriptProcessor = null;
    let leftChannelData = [];
    let rightChannelData = [];
    let totalRecordedSamples = 0;

    // Video Recording (MP4)
    let mediaRecorder = null;
    let recordedVideoChunks = [];

    const bg = new Image();  bg.src = 'main.jpg';
    const parts = new Image(); parts.src = 'parts.jpg';
    const partsOK = () => parts.complete && parts.naturalWidth > 0;

    let analyserSplit = null, analyserL = null, analyserR = null;
    let fftL, fftR, tdL, tdR;
    let tagInfo = null, fileName = '', playMs = 0, lastT = performance.now(), frameNo = 0;
    let spinFrame = 8, spinTick = -1;
    const voiceHist = Array.from({ length: 8 }, () => ({ lv: 0, env: 0 }));
    const specPeak = [new Float32Array(35), new Float32Array(35)];
    const masterHist = { l: 0, r: 0 };
    const INK = '#e6f4ff';

    // ---- スプライト座標（exe の .data にあった表から） ----
    const BTN = {                                    // ボタン帯 (y=13..19) → テンプレ上の位置
      play:  { s: [33, 13, 30, 7], d: [405, 32] },
      stop:  { s: [1, 13, 31, 7],  d: [444, 32] },
      pause: { s: [64, 13, 37, 7], d: [484, 32] }
    };
    // フォントスプライトの JPEG ノイズ（緑のにじみ）を除去してインク色に変換
    let fontSheet = null;
    function getFontSheet() {
      if (fontSheet) return fontSheet;
      if (!partsOK()) return null;
      const c = document.createElement('canvas');
      c.width = parts.naturalWidth; c.height = parts.naturalHeight;
      const g = c.getContext('2d', { willReadFrequently: true });
      //g.drawImage(parts, 0, 0);
      for (const [x, y, w, h, gain] of [[0, 0, 100, 13, 1.8], [0, 52, 205, 7, 1.08]]) {
        const im = g.getImageData(x, y, w, h), d = im.data;
        for (let k = 0; k < d.length; k += 4) {
          const L = (d[k] + d[k + 1] + d[k + 2]) / 3;
          const v = L < 70 ? 0 : Math.min(255, L * gain);
          d[k] = v * 0.92; d[k + 1] = v * 0.97; d[k + 2] = v;
        }
        //g.putImageData(im, x, y);
      }
      return (fontSheet = c);
    }
    const BIG = { '_': 10, ':': 11, ';': 12, ' ': 13 };        // 大フォント(10以降)
    function drawBig(str, x, y) {
      const sh = getFontSheet(); if (!sh) return;
      for (const ch of str) {
        const k = ch >= '0' && ch <= '9' ? ch.charCodeAt(0) - 48 : (BIG[ch] ?? 13);
        ctx.drawImage(sh, 1 + 7 * k, 1, 6, 11, x, y, 6, 11);
        x += 8;
      }
    }
    // 小フォント: 0-9, A-Z, 'o', '+', '-', ' ', '.'  (4x5, 5px送り)
    function smallIdx(ch) {
      if (ch >= '0' && ch <= '9') return ch.charCodeAt(0) - 48;
      if (ch >= 'A' && ch <= 'Z') return 10 + ch.charCodeAt(0) - 65;
      return { 'o': 36, '+': 37, '-': 38, ' ': 39, '.': 40 }[ch] ?? 39;
    }
    function drawSmall(str, x, y) {
      const sh = getFontSheet(); if (!sh) return;
      ctx.fillStyle = '#000';
      ctx.fillRect(x, y, str.length * 5, 5);
      for (const ch of str) {
        ctx.drawImage(sh, 1 + 5 * smallIdx(ch), 53, 4, 5, x, y, 4, 5);
        x += 5;
      }
    }
    const NOTE = ['C', 'C+', 'D', 'D+', 'E', 'F', 'F+', 'G', 'G+', 'A', 'A+', 'B'];
    // SPCピッチ → 鍵盤番号(0-119)。本家は SPC_NOTE.DLL でサンプルの基音を推定するため近似
    function noteIndex(pitch) {
      const f = 96 + 12 * Math.log2(Math.max(1, pitch) / 4096);
      return { idx: Math.max(0, Math.min(119, Math.round(f))), cents: Math.round((f - Math.round(f)) * 100) };
    }

    const ANCH = [[0,0],[500,.2],[2000,.43],[4000,.64],[8000,.85],[16000,1]];
    function freqPos(f) {
      for (let k = 1; k < ANCH.length; k++) {
        if (f <= ANCH[k][0]) { const a = ANCH[k-1], b = ANCH[k]; return a[1] + (f - a[0]) / (b[0] - a[0]) * (b[1] - a[1]); }
      }
      return 1;
    }

    function parseTag(buf) {
      const u = new Uint8Array(buf);
      if (u.length < 0x100 || u[0x23] !== 26) return { format: 'SPC' };
      const dec = (o, n) => {
        let e = o; while (e < o + n && u[e] !== 0) e++;
        try { return new TextDecoder('shift_jis').decode(u.subarray(o, e)).trim(); }
        catch (_) { return new TextDecoder().decode(u.subarray(o, e)).trim(); }
      };
      return {
        song: dec(0x2e, 32), game: dec(0x4e, 32), dumper: dec(0x6e, 16), comment: dec(0x7e, 32),
        date: dec(0x9e, 11), time: dec(0xa9, 3), fade: dec(0xac, 5), artist: dec(0xb1, 32),
        emu: ['UNKNOWN', 'ZSNES', 'SNES9X'][u[0xd2]] || 'UNKNOWN', format: 'SPC'
      };
    }

    // スペクトラム: 35バンド、3px幅+1px隙間(4px送り)、2pxピッチ32段、y=96..159
    function drawSpectrum(an, fft, x0, ch) {
      const N = 35, bars = new Float32Array(N);
      if (an && player && player.playing) {
        an.getFloatFrequencyData(fft);
        const binHz = audioCtx.sampleRate / an.fftSize;
        for (let k = 1; k < fft.length; k++) {
          const j = Math.min(N - 1, Math.floor(freqPos(k * binHz) * N));
          const v = Math.max(0, Math.min(1, (fft[k] + 105) / 105));
          if (v > bars[j]) bars[j] = v;
        }
      }
      const pk = specPeak[ch];
      for (let j = 0; j < N; j++) {
        pk[j] = Math.max(bars[j], pk[j] - 0.012);
        const x = x0 + j * 4, rows = Math.round(bars[j] * 32);
        ctx.fillStyle = '#bfe3ff';
        for (let r = 0; r < rows; r++) ctx.fillRect(x, 158 - 2 * r, 3, 1);
        if (pk[j] > 0.03) { ctx.fillStyle = '#fff'; ctx.fillRect(x, 158 - 2 * Math.min(31, Math.round(pk[j] * 32)), 3, 1); }
      }
    }
    // チャンネル情報バー: 5px幅+1px隙間、2pxピッチ、最大32段(y=192..255)
    function bar(x, rows, color) {
      ctx.fillStyle = color;
      for (let r = 0; r < Math.min(32, rows); r++) ctx.fillRect(x, 254 - 2 * r, 5, 1);
    }

    function drawVisualizer() {
      const now = performance.now();
      const playing = !!(player && player.playing);
      if (playing) playMs += now - lastT;
      lastT = now; frameNo++;

      ctx.save();
      ctx.scale(2, 2);
      ctx.imageSmoothingEnabled = false;
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, 670, 335);
      if (bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, 670, 335);

      const voiceStates = player ? player.getVoiceStates() : null;

      for (let i = 0; i < 8; i++) {
        const y0 = i * 32;
        const st = voiceStates ? voiceStates[i] : { envLevel: 0, volL: 0, volR: 0, pitch: 0, outSample: 0 };
        const h = voiceHist[i];
        const env7 = Math.max(0, Math.min(127, st.envLevel >> 4));
        const active = env7 > 0 && st.pitch > 0;
        const volL = Math.round(st.volL), volR = Math.round(st.volR);

        // 数値欄: TN(%3d) VL(%4d) VR(%4d) DT(%4d) / KN(4文字)
        const tn = st.srcn ?? st.srcN ?? st.sourceNumber ?? st.source ?? 0;
        drawSmall(String(tn).padStart(3), 121, y0 + 7);
        drawSmall(String(volL).padStart(4), 154, y0 + 7);
        drawSmall(String(volR).padStart(4), 191, y0 + 7);
        let note = null;
        if (active) {
          note = noteIndex(st.pitch);
          drawSmall(('o' + Math.floor(note.idx / 12) + NOTE[note.idx % 12]).padEnd(4), 80, y0 + 7);
          drawSmall(String(note.cents).padStart(4), 289, y0 + 7);
        } else {
          drawSmall('    ', 80, y0 + 7);
          drawSmall('   0', 289, y0 + 7);
        }

        // パン位置マーカー (常に描画) : pan = (|L|-|R|)/6.4 を ±10 に丸める。逆相なら別スプライト
        if (partsOK()) {
          let pan = Math.round((Math.abs(volL) - Math.abs(volR)) / 6.4);
          pan = Math.max(-10, Math.min(10, pan));
          const px = pan > 0 ? 329 - 2 * pan : pan < 0 ? 329 + 2 * -pan : 329;
          const inv = volL < 0 || volR < 0;
          if (inv) ctx.drawImage(parts, 289, 38, 41, 4, 309, y0 + 1, 41, 4);
          ctx.drawImage(parts, 331, inv ? 38 : 43, 1, 4, px, y0 + 1, 1, 4);

          // アクティブ時: 先頭ブロック + ENVX の長さのバー
          if (active) {
            ctx.drawImage(parts, 416, 48, 13, 4, 66, y0 + 1, 13, 4);
            const w = (env7 >> 1) * 2;
            if (w > 0) ctx.drawImage(parts, 289, 48, Math.min(126, w), 4, 80, y0 + 1, Math.min(126, w), 4);
            // 鍵盤: 該当オクターブだけ「点灯タイル」に差し替え
            const oct = Math.floor(note.idx / 12), sem = note.idx % 12;
            if (oct < 10) ctx.drawImage(parts, 1 + 35 * sem, 59, 34, 17, 1 + 35 * oct, y0 + 14, 34, 17);
          }
        }

        // チャンネルバー用の値: Lv = 8*log2(|out|+1) を 4行/段 で表示、減衰付き
        const out = Math.abs(st.outSample || 0);
        const lvNow = 8 * Math.log2(out + 1);
        h.lv = Math.max(lvNow, h.lv - 3);
        h.env = env7;
        const bx = 380 + 28 * i;
        const lvRows = Math.floor(h.lv / 4);
        bar(bx, lvRows, '#cfe8ff');                                  // 出力レベル(L)
        bar(bx + 6, lvRows, '#cfe8ff');                              // 出力レベル(R)
        bar(bx + 12, Math.abs(volL) >> 2, '#8fa8ff');                // 音量 L
        bar(bx + 18, Math.abs(volR) >> 2, '#8fa8ff');                // 音量 R
      }

      // スペクトラムアナライザー
      drawSpectrum(analyserL, fftL, 380, 0);
      drawSpectrum(analyserR, fftR, 527, 1);

      // マスターレベル
      let pl = 0, pr = 0;
      if (analyserL && playing) {
        analyserL.getFloatTimeDomainData(tdL); analyserR.getFloatTimeDomainData(tdR);
        for (let k = 0; k < tdL.length; k++) { pl = Math.max(pl, Math.abs(tdL[k])); pr = Math.max(pr, Math.abs(tdR[k])); }
      }
      masterHist.l = Math.max(8 * Math.log2(pl * 32768 + 1), masterHist.l - 3);
      masterHist.r = Math.max(8 * Math.log2(pr * 32768 + 1), masterHist.r - 3);
      for (let c = 0; c < 4; c++) { bar(619 + 6 * c, Math.floor(masterHist.l / 4), '#cfe8ff'); bar(643 + 6 * c, Math.floor(masterHist.r / 4), '#cfe8ff'); }

      // ヘッダー
      if (partsOK()) {
        // スピナー: 0.1秒ごとにコマ送り(0-7)、停止中は空コマ(8)
        const tot = Math.floor(playMs / 10);
        if (playing) {
          const tick = Math.floor(tot / 10);
          if (tick !== spinTick) { spinTick = tick; spinFrame = (spinFrame + 1) % 8; }
        } else spinFrame = 8;
        ctx.drawImage(parts, 1 + 32 * spinFrame, 21, 31, 31, 363, 25, 31, 31);

        // PLAY / PAUSE / STOP
        const key = playing ? 'play' : (playMs > 0 ? 'pause' : 'stop');
        const bt = BTN[key];
        ctx.fillStyle = '#000'; ctx.fillRect(bt.d[0], bt.d[1], bt.s[2], bt.s[3]);
        ctx.drawImage(parts, ...bt.s, bt.d[0], bt.d[1], bt.s[2], bt.s[3]);

        // 時間 "%03d%s%02d_%02d"（コロンは1秒ごとに点滅）
        const sec = Math.floor(tot / 100) % 60;
        const mm = String(Math.min(999, Math.floor(tot / 6000))).padStart(3, '0');
        drawBig(mm + (sec % 2 === 0 ? ':' : ';') + String(sec).padStart(2, '0') + '_' + String(tot % 100).padStart(2, '0'), 596, 19);
        // DSP VOLUME (2桁)
        drawBig(playing ? '99' : '00', 652, 34);

        // シークゲージ: 経過/曲長 を 60 段 (2px/段)。曲長は ID666 の秒数
        const len = tagInfo && parseInt(tagInfo.time, 10) > 0 ? parseInt(tagInfo.time, 10) : 0;
        if (len > 0) {
          const n = Math.max(0, Math.min(60, Math.floor(playMs / 1000 / len * 60)));
          if (n > 0) ctx.drawImage(parts, 289, 33, n * 2, 4, 403, 23, n * 2, 4);
        }
      }

      // PLAYING / ファイル名
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 255, 82, 14);
      ctx.fillStyle = '#fff';
      ctx.font = '12px "DotGothic16", monospace';
      ctx.fillText(playing ? 'PLAYING...' : (playMs > 0 ? 'PAUSED...' : 'STOPPED...'), 0, 266);
      ctx.font = '8px "DotGothic16", monospace';
      ctx.fillStyle = INK;
      ctx.fillText(fileName, 140, 265, 190);

      // タグ情報（ID666）
      if (tagInfo) {
        const L = [tagInfo.song, tagInfo.game, tagInfo.artist, tagInfo.dumper, tagInfo.comment];
        const R = [tagInfo.date, tagInfo.time ? tagInfo.time + ' sec' : '', tagInfo.fade ? tagInfo.fade + ' ms' : '', tagInfo.emu, tagInfo.format];
        for (let k = 0; k < 5; k++) {
          const y = 288 + 11.6 * k;
          if (L[k]) ctx.fillText(L[k], 56, y, 270);
          if (R[k]) ctx.fillText(R[k], 400, y, 255);
        }
      }

      ctx.restore();
      animationFrameId = requestAnimationFrame(drawVisualizer);
    }

    function initAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        setupRecordingNodes();
        player = new SPCPlayer(audioCtx);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    const originalConnect = AudioNode.prototype.connect;
    AudioNode.prototype.connect = function(destination, output, input) {
      const res = originalConnect.apply(this, arguments);
      if (audioCtx && destination === audioCtx.destination && this !== scriptProcessor) {
        try {
          if (scriptProcessor) originalConnect.call(this, scriptProcessor, output, input);
          if (mediaStreamDest) originalConnect.call(this, mediaStreamDest, output, input);
          if (analyserSplit) originalConnect.call(this, analyserSplit, output, input);
        } catch (e) {
          console.error("Audio Routing Error:", e);
        }
      }
      return res;
    };

    function setupRecordingNodes() {
      if (!audioCtx) return;

      if (!mediaStreamDest) {
        mediaStreamDest = audioCtx.createMediaStreamDestination();
      }

      if (!analyserSplit) {
        analyserSplit = audioCtx.createChannelSplitter(2);
        analyserL = audioCtx.createAnalyser(); analyserR = audioCtx.createAnalyser();
        analyserL.fftSize = analyserR.fftSize = 2048;
        analyserL.smoothingTimeConstant = analyserR.smoothingTimeConstant = 0.7;
        analyserSplit.connect(analyserL, 0); analyserSplit.connect(analyserR, 1);
        fftL = new Float32Array(analyserL.frequencyBinCount); fftR = new Float32Array(analyserR.frequencyBinCount);
        tdL = new Float32Array(analyserL.fftSize); tdR = new Float32Array(analyserR.fftSize);
      }

      if (!scriptProcessor) {
        scriptProcessor = audioCtx.createScriptProcessor(4096, 2, 2);
        scriptProcessor.onaudioprocess = (e) => {
          if (!isExporting) return;
          if (exportMode === 'wav' || exportMode === 'mp3') {
            const inputL = e.inputBuffer.getChannelData(0);
            const inputR = e.inputBuffer.getChannelData(1);
            leftChannelData.push(new Float32Array(inputL));
            rightChannelData.push(new Float32Array(inputR));
            totalRecordedSamples += inputL.length;
          }
        };
        scriptProcessor.connect(audioCtx.destination);
      }
    }

    function handleFile(file) {
      if (!file || !file.name.toLowerCase().endsWith('.spc')) {
        showNotice('Invalid file format. Please select an .spc file.');
        return;
      }

      initAudioContext();

      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          player.load(e.target.result);
          tagInfo = parseTag(e.target.result); fileName = file.name; playMs = 0;
          btnPlay.disabled = false;
          btnStop.disabled = false;
          
        } catch (err) {
          console.error(err);
          showNotice('SPCファイルの読み込みに失敗しました。');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function startPlayback() {
      if (!player) return;
      player.play();
    }

    function pausePlayback() {
      if (!player) return;
      player.stop();
      if (isExporting) {
        stopExport(false);
      }
    }

    function showNotice(msg) {
      const banner = document.createElement('div');
      banner.style.position = 'fixed';
      banner.style.top = '10px';
      banner.style.right = '10px';
      banner.style.background = '#e11d48';
      banner.style.color = '#fff';
      banner.style.padding = '10px 15px';
      banner.style.border = '1px solid white';
      banner.style.fontFamily = '"DotGothic16", sans-serif';
      banner.style.zIndex = '9999';
      banner.textContent = msg;
      document.body.appendChild(banner);
      setTimeout(() => banner.remove(), 3000);
    }

    // --- 秒数指定エクスポート処理 ---

    function startExport() {
      initAudioContext();

      if (!player) {
        showNotice('SPCファイルを選択するか、DOWN.SPCを読み込んでください。');
        return;
      }

      exportTargetDuration = parseInt(exportDurationInput.value, 10) || 60;
      exportMode = exportFormatSelect.value;
      isExporting = true;
      exportStartTime = Date.now();

      btnExport.textContent = '中止';
      btnExport.classList.add('is-exporting');
      exportStatus.style.display = 'inline-flex';

      if (!player.playing) {
        startPlayback();
      }

      if (exportMode === 'wav' || exportMode === 'mp3') {
        leftChannelData = [];
        rightChannelData = [];
        totalRecordedSamples = 0;
      } else if (exportMode === 'mp4') {
        recordedVideoChunks = [];

        // 高画質フレームレート（60FPS）でキャプチャ
        const canvasStream = canvas.captureStream(60);
        const audioTrack = mediaStreamDest.stream.getAudioTracks()[0];

        const combinedStream = new MediaStream();
        canvasStream.getVideoTracks().forEach(track => combinedStream.addTrack(track));
        if (audioTrack) {
          combinedStream.addTrack(audioTrack);
        }

        let mimeType = 'video/mp4;codecs=avc1,mp4a.40.2';
        if (!MediaRecorder.isTypeSupported(mimeType)) {
          if (MediaRecorder.isTypeSupported('video/mp4')) {
            mimeType = 'video/mp4';
          } else if (MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')) {
            mimeType = 'video/webm;codecs=vp9,opus';
          } else {
            mimeType = 'video/webm';
          }
        }

        try {
          mediaRecorder = new MediaRecorder(combinedStream, { 
            mimeType: mimeType,
            videoBitsPerSecond: 5000000 // ビットレートを5Mbpsに上げて画質を向上
          });
        } catch (e) {
          mediaRecorder = new MediaRecorder(combinedStream);
        }

        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) {
            recordedVideoChunks.push(e.data);
          }
        };

        mediaRecorder.onstop = () => {
          const actualMime = mediaRecorder.mimeType || 'video/mp4';
          const ext = actualMime.includes('mp4') ? 'mp4' : 'webm';
          const blob = new Blob(recordedVideoChunks, { type: actualMime });
          downloadBlob(blob, `spc_export_${exportTargetDuration}s.${ext}`);
        };

        mediaRecorder.start(100);
      }

      exportInterval = setInterval(() => {
        const elapsed = (Date.now() - exportStartTime) / 1000;
        const progressPercent = Math.min(100, Math.floor((elapsed / exportTargetDuration) * 100));
        
        exportProgress.textContent = `${Math.floor(elapsed)} / ${exportTargetDuration}s (${progressPercent}%)`;

        if (elapsed >= exportTargetDuration) {
          stopExport(true);
        }
      }, 100);
    }

    function stopExport(saveFile = true) {
      if (!isExporting) return;
      isExporting = false;

      clearInterval(exportInterval);
      btnExport.textContent = '書き出し';
      btnExport.classList.remove('is-exporting');
      exportStatus.style.display = 'none';

      if (saveFile) {
        if (exportMode === 'wav') {
          exportWAV();
        } else if (exportMode === 'mp3') {
          exportMP3();
        } else if (exportMode === 'mp4') {
          if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
          }
        }
      } else {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        showNotice('書き出しをキャンセルしました。');
      }
    }

    function exportWAV() {
      if (totalRecordedSamples === 0) {
        showNotice('データが取得できませんでした。');
        return;
      }
      const sampleRate = audioCtx.sampleRate;
      const mergedL = new Float32Array(totalRecordedSamples);
      const mergedR = new Float32Array(totalRecordedSamples);

      let offset = 0;
      for (let i = 0; i < leftChannelData.length; i++) {
        mergedL.set(leftChannelData[i], offset);
        mergedR.set(rightChannelData[i], offset);
        offset += leftChannelData[i].length;
      }

      const wavBuffer = createWavFileHeader(mergedL, mergedR, sampleRate);
      const blob = new Blob([wavBuffer], { type: 'audio/wav' });
      downloadBlob(blob, `spc_audio_${exportTargetDuration}s.wav`);
    }

    function createWavFileHeader(left, right, sampleRate) {
      const numChannels = 2;
      const bitsPerSample = 16;
      const bytesPerSample = bitsPerSample / 8;
      const blockAlign = numChannels * bytesPerSample;
      const numSamples = left.length;
      const dataSize = numSamples * blockAlign;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(view, offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitsPerSample, true);
      writeString(view, 36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < numSamples; i++) {
        let sL = Math.max(-1, Math.min(1, left[i]));
        let sR = Math.max(-1, Math.min(1, right[i]));
        view.setInt16(offset, sL < 0 ? sL * 0x8000 : sL * 0x7FFF, true);
        offset += 2;
        view.setInt16(offset, sR < 0 ? sR * 0x8000 : sR * 0x7FFF, true);
        offset += 2;
      }

      return buffer;
    }

    function exportMP3() {
      if (typeof lamejs === 'undefined') {
        showNotice('lamejsライブラリの読み込みに失敗しています。');
        return;
      }
      if (totalRecordedSamples === 0) {
        showNotice('データが取得できませんでした。');
        return;
      }

      const sampleRate = audioCtx.sampleRate;
      const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, 128);
      const mp3Data = [];

      const mergedL = new Float32Array(totalRecordedSamples);
      const mergedR = new Float32Array(totalRecordedSamples);

      let offset = 0;
      for (let i = 0; i < leftChannelData.length; i++) {
        mergedL.set(leftChannelData[i], offset);
        mergedR.set(rightChannelData[i], offset);
        offset += leftChannelData[i].length;
      }

      const leftInt16 = new Int16Array(totalRecordedSamples);
      const rightInt16 = new Int16Array(totalRecordedSamples);

      for (let i = 0; i < totalRecordedSamples; i++) {
        let sL = Math.max(-1, Math.min(1, mergedL[i]));
        let sR = Math.max(-1, Math.min(1, mergedR[i]));
        leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
        rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
      }

      const sampleBlockSize = 1152;
      for (let i = 0; i < totalRecordedSamples; i += sampleBlockSize) {
        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
        const rightChunk = rightInt16.subarray(i, i + sampleBlockSize);
        const mp3buf = mp3encoder.encodeBuffer(leftChunk, rightChunk);
        if (mp3buf.length > 0) {
          mp3Data.push(mp3buf);
        }
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) {
        mp3Data.push(mp3buf);
      }

      const blob = new Blob(mp3Data, { type: 'audio/mp3' });
      downloadBlob(blob, `spc_audio_${exportTargetDuration}s.mp3`);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.style.display = 'none';
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }

    // Event Listeners
    btnPlay.addEventListener('click', () => {
      initAudioContext();
      if (player.playing) {
        pausePlayback();
      } else {
        startPlayback();
      }
    });

    btnStop.addEventListener('click', () => {
      if (player) {
        pausePlayback();
      }
    });

    testPlay.addEventListener('click', () => {
      initAudioContext();
      player.loadUrl("down.spc");
      fileName = "DOWN.SPC"; playMs = 0; tagInfo = null;
      fetch("down.spc").then(r => r.arrayBuffer()).then(b => { tagInfo = parseTag(b); }).catch(() => {});
    });

    btnExport.addEventListener('click', () => {
      if (isExporting) {
        stopExport(false);
      } else {
        startExport();
      }
    });

    // File Input Drag & Drop / Image Change
    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleFile(e.target.files[0]);
      }
    });

    bgInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        bg.src = URL.createObjectURL(file);
      }
    });

    partsInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        const file = e.target.files[0];
        parts.onload = () => {
          fontSheet = null; // 画像更新に伴いフォントシートキャッシュを再生成対象にリセット
        };
        parts.src = URL.createObjectURL(file);
      }
    });

    // Start Rendering Loop on Window Load
    window.onload = () => {
      drawVisualizer();
    };
  </script>
</body>
</html>
